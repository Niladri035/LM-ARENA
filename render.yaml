services:
  # 1. Backend Web Service
  - type: web
    name: lm-arena-backend   # rename to lm-arena-4 if needed
    runtime: node
    rootDir: Backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        sync: false # Set to frontend URL in Render dashboard
      - key: GOOGLE_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false

  # 2. Frontend Static Site
  - type: web
    name: lm-arena-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # Set to backend URL in Render dashboard
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
